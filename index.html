        const ScoringEngine = {
            evaluate: (questions, userAnswers, config = { partialScoring: true }) => {
                let totalEarnedScore = 0;
                let totalMaxScore = 0;
                let correctCount = 0;
                let wrongCount = 0;
                let partialCount = 0;
                let emptyCount = 0;

                const detailedResults = questions.map(q => {
                    const weight = q.weight || 2;
                    totalMaxScore += weight;
                    const uAns = userAnswers[q.id];

                    if (!uAns || (Array.isArray(uAns) && uAns.length === 0) || (typeof uAns === 'object' && Object.keys(uAns).length === 0)) {
                        emptyCount++;
                        return { questionId: q.id, score: 0, maxScore: weight, status: "KOSONG" };
                    }

                    if (q.type === "PG_BIASA") {
                        if (uAns === q.key) {
                            totalEarnedScore += weight;
                            correctCount++;
                            return { questionId: q.id, score: weight, maxScore: weight, status: "BENAR" };
                        } else {
                            wrongCount++;
                            return { questionId: q.id, score: 0, maxScore: weight, status: "SALAH" };
                        }
                    } 
                    else if (q.type === "PG_KOMPLEKS") {
                        const correctKeys = q.key || [];
                        const userSelected = Array.isArray(uAns) ? uAns : [];

                        const numCorrectSelected = userSelected.filter(k => correctKeys.includes(k)).length;
                        const numWrongSelected = userSelected.filter(k => !correctKeys.includes(k)).length;

                        if (numCorrectSelected === correctKeys.length && numWrongSelected === 0) {
                            totalEarnedScore += weight;
                            correctCount++;
                            return { questionId: q.id, score: weight, maxScore: weight, status: "BENAR" };
                        } else if (config.partialScoring) {
                            // Partial score calculation
                            let partScore = (numCorrectSelected / correctKeys.length) * weight - (numWrongSelected * 0.25 * weight);
                            partScore = Math.max(0, Math.min(weight, partScore));
                            totalEarnedScore += partScore;
                            if (partScore > 0) {
                                partialCount++;
                                return { questionId: q.id, score: partScore, maxScore: weight, status: "PARSIAL" };
                            } else {
                                wrongCount++;
                                return { questionId: q.id, score: 0, maxScore: weight, status: "SALAH" };
                            }
                        } else {
                            wrongCount++;
                            return { questionId: q.id, score: 0, maxScore: weight, status: "SALAH" };
                        }
                    } 
                    else if (q.type === "PG_BENAR_SALAH") {
                        const keysMap = q.key || {};
                        const statements = q.statements || [];
                        let statementCorrect = 0;

                        statements.forEach(st => {
                            if (uAns[st.id] === keysMap[st.id]) {
                                statementCorrect++;
                            }
                        });

                        const fraction = statementCorrect / statements.length;
                        const scoreEarned = fraction * weight;
                        totalEarnedScore += scoreEarned;

                        if (statementCorrect === statements.length) {
                            correctCount++;
                            return { questionId: q.id, score: weight, maxScore: weight, status: "BENAR" };
                        } else if (statementCorrect > 0) {
                            partialCount++;
                            return { questionId: q.id, score: scoreEarned, maxScore: weight, status: "PARSIAL" };
                        } else {
                            wrongCount++;
                            return { questionId: q.id, score: 0, maxScore: weight, status: "SALAH" };
                        }
                    }

                    return { questionId: q.id, score: 0, maxScore: weight, status: "SALAH" };
                });

                const normalizedScore = totalMaxScore > 0 ? (totalEarnedScore / totalMaxScore) * 100 : 0;

                return {
                    finalScore: Math.round(normalizedScore * 10) / 10,
                    rawScore: totalEarnedScore,
                    maxScore: totalMaxScore,
                    correctCount,
                    wrongCount,
                    partialCount,
                    emptyCount,
                    detailedResults
                };
            }
        };

                                    <p className="text-brand-100 text-sm mt-1">Sistem Evaluasi Komputer Tes Kemampuan Akademik Matematika</p>
                                </div>
                                <span className="mt-3 sm:mt-0 px-3 py-1 bg-amber-400 text-slate-900 font-bold rounded-full text-xs">
                                    Kelas {user.class}
                                </span>
                            </div>
                        </div>

                        <div className="p-6 space-y-6">
                            {/* Identitas Peserta */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div>
                                    <p className="text-xs text-slate-500 uppercase font-semibold">Nama Peserta</p>
                                    <p className="font-bold text-slate-800">{user.name}</p>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-500 uppercase font-semibold">Mata Pelajaran</p>
                                    <p className="font-bold text-brand-700">Matematika SD</p>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-500 uppercase font-semibold">Jumlah Soal / Durasi</p>
                                    <p className="font-bold text-slate-800">35 Soal / {config.durationMinutes} Menit</p>
                                </div>
                            </div>

                            {/* Ketentuan Jenis Soal */}
                            <div>
                                <h3 className="text-md font-bold text-slate-800 border-b pb-2 mb-3">Komposisi Soal Ujian:</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl">
                                        <div className="flex items-center space-x-2 text-blue-800 font-bold mb-1">
                                            <span className="w-6 h-6 bg-blue-600 text-white rounded-full flex items-center justify-center text-xs">A</span>
                                            <span>Pilihan Ganda Biasa</span>
                                        </div>
                                        <p className="text-xs text-slate-600">20 Soal (No 1-20). Pilih 1 jawaban paling tepat dari 4 opsi (A, B, C, D).</p>
                                    </div>
                                    <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-xl">
                                        <div className="flex items-center space-x-2 text-emerald-800 font-bold mb-1">
                                            <span className="w-6 h-6 bg-emerald-600 text-white rounded-full flex items-center justify-center text-xs">B</span>
                                            <span>Pilihan Ganda Kompleks</span>
                                        </div>
                                        <p className="text-xs text-slate-600">10 Soal (No 21-30). Pilih semua opsi yang benar. Berlaku penilaian parsial.</p>
                                    </div>
                                    <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl">
                                        <div className="flex items-center space-x-2 text-amber-800 font-bold mb-1">
                                            <span className="w-6 h-6 bg-amber-600 text-white rounded-full flex items-center justify-center text-xs">C</span>
                                            <span>Benar / Salah Kompleks</span>
                                        </div>
                                        <p className="text-xs text-slate-600">5 Soal (No 31-35). Tentukan pilihan BENAR atau SALAH pada setiap pernyataan.</p>
                                    </div>
                                </div>
                            </div>

                            {/* Tata Cara & Aturan */}
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-slate-700 space-y-2">
                                <h4 className="font-bold text-slate-800 text-sm">Tata Cara Pengerjaan:</h4>
                                <ul className="list-disc pl-5 space-y-1">
                                    <li>Jawaban tersimpan secara otomatis setiap kali Anda memilih atau mengubah pilihan.</li>
                                    <li>Gunakan panel tombol navigasi soal untuk berpindah ke nomor tertentu.</li>
                                    <li>Gunakan tombol <b>Tandai Ragu-Ragu</b> jika Anda belum yakin dengan jawaban.</li>
                                    <li>Waktu berjalan terus sejak Anda menekan tombol "Mulai Ujian". Apabila waktu habis, ujian akan terkumpul otomatis.</li>
                                </ul>
                            </div>

                            {existingResults && !config.allowRetake ? (
                                <div className="p-4 bg-amber-100 border-l-4 border-amber-500 text-amber-900 rounded">
                                    <p className="font-bold">Anda Sudah Menyelesaikan Ujian Ini.</p>
                                    <p className="text-xs mt-1">Nilai Anda: <b>{existingResults.score}</b>. Administrator membatasi ujian ulang.</p>
                                    <button 
                                        onClick={() => setView("RESULT")}
                                        className="mt-3 px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-lg"
                                    >
                                        Lihat Hasil Ujian Anda
                                    </button>
                                </div>
                            ) : (
                                <div className="flex justify-end space-x-3 pt-4 border-t">
                                    <button
                                        onClick={startExam}
                                        className="px-8 py-3 bg-accent-600 hover:bg-accent-700 text-white font-extrabold rounded-xl shadow-lg transition transform active:scale-95 flex items-center space-x-2"
                                    >
                                        <i className="fa-solid fa-play"></i>
                                        <span>MULAI UJIAN SEKARANG</span>
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // ==========================================
        function ExamView({ user, examSession, setExamSession, setView, showToast }) {
            const questions = useMemo(() => DataService.getQuestions(), []);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState(examSession?.answers || {});
            const [reviewed, setReviewed] = useState(examSession?.reviewed || {});
            const [remainingTime, setRemainingTime] = useState(0);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showMobileDrawer, setShowMobileDrawer] = useState(false);

            const currentQ = questions[currentIndex];

            // Timer & Auto Sync Handling
            useEffect(() => {
                if (!examSession) return;

                const updateTimer = () => {
                    const now = Date.now();
                    const left = Math.max(0, Math.floor((examSession.endTime - now) / 1000));
                    setRemainingTime(left);

                    if (left === 15 * 60) showToast("Peringatan: Waktu tersisa 15 menit lagi!", "error");
                    if (left === 5 * 60) showToast("Peringatan: Waktu tersisa 5 menit lagi!", "error");
                    if (left === 1 * 60) showToast("Peringatan: Waktu tersisa 1 menit lagi!", "error");

                    if (left <= 0) {
                        showToast("Waktu Ujian telah habis! Mengumpulkan otomatis...", "error");
                        handleFinalSubmit();
                    }
                };

                updateTimer();
                const timerInterval = setInterval(updateTimer, 1000);
                return () => clearInterval(timerInterval);
            }, [examSession]);

            // Save session to localStorage on answer updates
            const updateAnswer = (qId, val) => {
                const updatedAnswers = { ...answers, [qId]: val };
                setAnswers(updatedAnswers);

                const updatedSession = { ...examSession, answers: updatedAnswers, reviewed };
                setExamSession(updatedSession);
                DataService.saveActiveSession(user.id, updatedSession);
            };

            const toggleReview = (qId) => {
                const updatedReviewed = { ...reviewed, [qId]: !reviewed[qId] };
                setReviewed(updatedReviewed);

                const updatedSession = { ...examSession, answers, reviewed: updatedReviewed };
                setExamSession(updatedSession);
                DataService.saveActiveSession(user.id, updatedSession);
            };

            const handleFinalSubmit = () => {
                const config = DataService.getExamConfig();
                const evalResult = ScoringEngine.evaluate(questions, answers, config);

                const finalRecord = {
                    id: `RES_${user.id}_${Date.now()}`,
                    userId: user.id,
                    userName: user.name,
                    userNumber: user.username,
                    userClass: user.class,
                    startTime: new Date(examSession.startTime).toISOString(),
                    endTime: new Date().toISOString(),
                    durationMinutes: Math.ceil((Date.now() - examSession.startTime) / 60000),
                    score: evalResult.finalScore,
                    rawScore: evalResult.rawScore,
                    maxScore: evalResult.maxScore,
                    correctCount: evalResult.correctCount,
                    partialCount: evalResult.partialCount,
                    wrongCount: evalResult.wrongCount,
                    emptyCount: evalResult.emptyCount,
                    answers: answers,
                    detailedResults: evalResult.detailedResults
                };

                DataService.saveResult(finalRecord);
                DataService.clearActiveSession(user.id);
                showToast("Ujian berhasil dikumpulkan!", "success");
                setView("RESULT");
            };

            // Formatting time
            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h > 0 ? h + ':' : ''}${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const answeredCount = Object.keys(answers).filter(k => {
                const val = answers[k];
                if (!val) return false;
                if (Array.isArray(val) && val.length === 0) return false;
                if (typeof val === 'object' && !Array.isArray(val) && Object.keys(val).length === 0) return false;
                return true;
            }).length;

            const reviewCount = Object.values(reviewed).filter(Boolean).length;
            const remainingCount = questions.length - answeredCount;

            return (
                <div className="max-w-7xl mx-auto p-3 sm:p-6 space-y-4">
                    {/* Header bar CBT */}
                    <div className="bg-white p-4 rounded-xl shadow-md border border-slate-200 flex flex-wrap justify-between items-center gap-3">
                        <div>
                            <span className="text-xs text-slate-500 uppercase font-semibold">Peserta Ujian</span>
                            <p className="text-sm font-bold text-slate-800">{user.name} ({user.username})</p>
                        </div>
                        
                        <div className="flex items-center space-x-4">
                            {/* Autosave badge indicator */}
                            <span className="hidden sm:inline-flex items-center text-xs text-emerald-600 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full font-medium">
                                <i className="fa-solid fa-cloud-arrow-up mr-1.5 animate-pulse"></i> Tersimpan Otomatis
                            </span>

                            {/* Timer Badge */}
                            <div className={`px-4 py-2 rounded-xl border flex items-center space-x-2 font-mono text-lg font-bold ${
                                remainingTime < 300 ? 'bg-red-50 text-red-600 border-red-200 animate-pulse' : 'bg-slate-900 text-emerald-400 border-slate-800'
                            }`}>
                                <i className="fa-regular fa-clock"></i>
                                <span>{formatTime(remainingTime)}</span>
                            </div>

                            <button
                                onClick={() => setShowMobileDrawer(!showMobileDrawer)}
                                className="md:hidden px-3 py-2 bg-brand-600 text-white rounded-lg text-xs font-semibold"
                            >
                                <i className="fa-solid fa-border-all mr-1"></i> Soal
                            </button>
                        </div>
                    </div>

                    {/* Main Layout Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        {/* Question Work Area (3 Columns) */}
                        <div className="md:col-span-3 space-y-4">
                            {currentQ && (
                                <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-5 sm:p-8 flex flex-col justify-between min-h-[500px]">
                                    <div>
                                        {/* Question header info */}
                                        <div className="flex justify-between items-center border-b pb-3 mb-4">
                                            <div className="flex items-center space-x-2">
                                                <span className="bg-brand-600 text-white px-3 py-1 rounded-lg font-extrabold text-sm">
                                                    Soal No. {currentQ.number}
                                                </span>
                                                <span className={`text-xs px-2.5 py-1 rounded-md font-semibold ${
                                                    currentQ.type === 'PG_BIASA' ? 'bg-blue-100 text-blue-800' :
                                                    currentQ.type === 'PG_KOMPLEKS' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                                }`}>
                                                    {currentQ.type === 'PG_BIASA' ? 'Pilihan Ganda' :
                                                     currentQ.type === 'PG_KOMPLEKS' ? 'Pilihan Ganda Kompleks' : 'Benar / Salah Kompleks'}
                                                </span>
                                            </div>
                                            <span className="text-xs text-slate-400 font-medium hidden sm:inline">
                                                {currentQ.category}
                                            </span>
                                        </div>

                                        {/* Teks Soal */}
                                        <div className="text-slate-800 font-medium text-base sm:text-lg mb-6 leading-relaxed">
                                            {currentQ.question}
                                        </div>

                                        {/* Dynamic Option Renderer */}
                                        <OptionRenderer
                                            question={currentQ}
                                            answer={answers[currentQ.id]}
                                            onAnswerChange={(val) => updateAnswer(currentQ.id, val)}
                                        />
                                    </div>

                                    {/* Action Navigation Footer */}
                                    <div className="pt-6 border-t mt-8 flex flex-wrap justify-between items-center gap-3">
                                        <button
                                            disabled={currentIndex === 0}
                                            onClick={() => setCurrentIndex(currentIndex - 1)}
                                            className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 font-semibold text-xs sm:text-sm rounded-xl transition flex items-center space-x-2"
                                        >
                                            <i className="fa-solid fa-arrow-left"></i>
                                            <span>Sebelumnya</span>
                                        </button>

                                        <button
                                            onClick={() => toggleReview(currentQ.id)}
                                            className={`px-4 py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition flex items-center space-x-2 border ${
                                                reviewed[currentQ.id]
                                                    ? 'bg-amber-500 text-white border-amber-600'
                                                    : 'bg-white text-amber-600 border-amber-400 hover:bg-amber-50'
                                            }`}
                                        >
                                            <i className="fa-solid fa-bookmark"></i>
                                            <span>{reviewed[currentQ.id] ? 'Ditandai Ragu' : 'Tandai Ragu-Ragu'}</span>
                                        </button>

                                        {currentIndex < questions.length - 1 ? (
                                            <button
                                                onClick={() => setCurrentIndex(currentIndex + 1)}
                                                className="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs sm:text-sm rounded-xl shadow transition flex items-center space-x-2"
                                            >
                                                <span>Berikutnya</span>
                                                <i className="fa-solid fa-arrow-right"></i>
                                            </button>
                                        ) : (
                                            <button
                                                onClick={() => setShowConfirmModal(true)}
                                                className="px-6 py-2.5 bg-accent-600 hover:bg-accent-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-lg transition flex items-center space-x-2"
                                            >
                                                <i className="fa-solid fa-check-double"></i>
                                                <span>Kumpulkan Ujian</span>
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Navigation Panel Drawer (Desktop Column & Mobile Drawer) */}
                        <div className={`fixed md:relative inset-y-0 right-0 z-40 w-80 md:w-auto bg-white md:bg-transparent p-4 md:p-0 shadow-2xl md:shadow-none transition-transform duration-300 md:block ${
                            showMobileDrawer ? 'translate-x-0' : 'translate-x-full md:translate-x-0'
                        }`}>
                            <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-4 space-y-4">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-slate-800 text-sm">Navigasi Soal</h3>
                                    <button onClick={() => setShowMobileDrawer(false)} className="md:hidden text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {/* Summary Pills */}
                                <div className="grid grid-cols-3 gap-1.5 text-center text-[10px]">
                                    <div className="bg-emerald-50 border border-emerald-200 p-1.5 rounded-lg text-emerald-800">
                                        <p className="font-extrabold text-sm">{answeredCount}</p>
                                        <p>Dijawab</p>
                                    </div>
                                    <div className="bg-amber-50 border border-amber-200 p-1.5 rounded-lg text-amber-800">
                                        <p className="font-extrabold text-sm">{reviewCount}</p>
                                        <p>Ragu-ragu</p>
                                    </div>
                                    <div className="bg-slate-100 border border-slate-200 p-1.5 rounded-lg text-slate-700">
                                        <p className="font-extrabold text-sm">{remainingCount}</p>
                                        <p>Belum</p>
                                    </div>
                                </div>

                                {/* Grid of Numbers */}
                                <div className="grid grid-cols-5 gap-2 max-h-[360px] overflow-y-auto custom-scrollbar p-1">
                                    {questions.map((q, idx) => {
                                        const isAns = answers[q.id] && (
                                            Array.isArray(answers[q.id]) ? answers[q.id].length > 0 :
                                            typeof answers[q.id] === 'object' ? Object.keys(answers[q.id]).length > 0 : true
                                        );
                                        const isRev = reviewed[q.id];
                                        const isCur = idx === currentIndex;

                                        let btnStyle = "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
                                        if (isRev) btnStyle = "bg-amber-500 text-white border-amber-600 font-bold";
                                        else if (isAns) btnStyle = "bg-emerald-600 text-white border-emerald-700 font-bold";

                                        if (isCur) btnStyle += " ring-2 ring-brand-500 ring-offset-2";

                                        return (
                                            <button
                                                key={q.id}
                                                onClick={() => {
                                                    setCurrentIndex(idx);
                                                    setShowMobileDrawer(false);
                                                }}
                                                className={`h-10 rounded-xl text-xs font-semibold flex items-center justify-center transition border ${btnStyle}`}
                                            >
                                                {q.number}
                                            </button>
                                        );
                                    })}
                                </div>

                                <button
                                    onClick={() => setShowConfirmModal(true)}
                                    className="w-full py-2.5 bg-accent-600 hover:bg-accent-700 text-white font-bold rounded-xl shadow transition text-xs flex justify-center items-center space-x-1.5"
                                >
                                    <i className="fa-solid fa-paper-plane"></i>
                                    <span>SELESAI & KUMPULKAN</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Confirmation Modal */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-scale-up">
                                <div className="text-center space-y-3">
                                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                                        <i className="fa-solid fa-circle-question"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-slate-800">Konfirmasi Pengumpulan</h3>
                                    <p className="text-xs text-slate-600">Apakah Anda yakin ingin mengakhiri dan mengumpulkan hasil ujian ini?</p>

                                    {/* Summary Stats */}
                                    <div className="bg-slate-50 p-3 rounded-xl border text-xs text-left space-y-1">
                                        <div className="flex justify-between">
                                            <span>Soal Dijawab:</span>
                                            <span className="font-bold text-emerald-600">{answeredCount} Soal</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Soal Ragu-ragu:</span>
                                            <span className="font-bold text-amber-600">{reviewCount} Soal</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Belum Dijawab:</span>
                                            <span className="font-bold text-red-600">{remainingCount} Soal</span>
                                        </div>
                                    </div>

                                    <div className="flex space-x-3 pt-3">
                                        <button
                                            onClick={() => setShowConfirmModal(false)}
                                            className="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-xs"
                                        >
                                            Kembali ke Ujian
                                        </button>
                                        <button
                                            onClick={handleFinalSubmit}
                                            className="flex-1 py-2.5 bg-accent-600 hover:bg-accent-700 text-white font-bold rounded-xl text-xs shadow-md"
                                        >
                                            Ya, Kumpulkan!
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Helper component for interactive options
        function OptionRenderer({ question, answer, onAnswerChange }) {
            if (question.type === "PG_BIASA") {
                return (
                    <div className="space-y-3">
                        {question.options.map((opt, idx) => {
                            const optKey = opt.charAt(0); // A, B, C, D
                            const isSelected = answer === optKey;

                            return (
                                <label
                                    key={idx}
                                    onClick={() => onAnswerChange(optKey)}
                                    className={`flex items-center p-4 rounded-xl border-2 cursor-pointer transition ${
                                        isSelected
                                            ? 'border-brand-600 bg-brand-50/60 shadow-sm'
                                            : 'border-slate-200 hover:border-brand-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center mr-3 ${
                                        isSelected ? 'border-brand-600 bg-brand-600' : 'border-slate-300'
                                    }`}>
                                        {isSelected && <div className="w-2 h-2 bg-white rounded-full"></div>}
                                    </div>
                                    <span className="text-sm font-medium text-slate-800">{opt}</span>
                                </label>
                            );
                        })}
                    </div>
                );
            } 
            else if (question.type === "PG_KOMPLEKS") {
                const currentArr = Array.isArray(answer) ? answer : [];

                const toggleSelection = (optKey) => {
                    if (currentArr.includes(optKey)) {
                        onAnswerChange(currentArr.filter(k => k !== optKey));
                    } else {
                        onAnswerChange([...currentArr, optKey]);
                    }
                };

                return (
                    <div className="space-y-3">
                        <p className="text-xs font-bold text-emerald-700 bg-emerald-50 p-2.5 rounded-lg border border-emerald-200 flex items-center">
                            <i className="fa-solid fa-list-check mr-2"></i> Petunjuk: Pilih semua jawaban yang menurut Anda benar.
                        </p>
                        {question.options.map((opt, idx) => {
                            const optKey = opt.charAt(0);
                            const isSelected = currentArr.includes(optKey);

                            return (
                                <label
                                    key={idx}
                                    onClick={() => toggleSelection(optKey)}
                                    className={`flex items-center p-4 rounded-xl border-2 cursor-pointer transition ${
                                        isSelected
                                            ? 'border-emerald-600 bg-emerald-50/60 shadow-sm'
                                            : 'border-slate-200 hover:border-emerald-300 hover:bg-slate-50'
                                    }`}
                                >
                                    <div className={`w-5 h-5 rounded border-2 flex items-center justify-center mr-3 ${
                                        isSelected ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-slate-300'
                                    }`}>
                                        {isSelected && <i className="fa-solid fa-check text-xs"></i>}
                                    </div>
                                    <span className="text-sm font-medium text-slate-800">{opt}</span>
                                </label>
                            );
                        })}
                    </div>
                );
            } 
            else if (question.type === "PG_BENAR_SALAH") {
                const answersMap = answer || {};

                const setStatementVal = (stId, val) => {
                    onAnswerChange({ ...answersMap, [stId]: val });
                };

                return (
                    <div className="space-y-4">
                        <p className="text-xs font-bold text-amber-800 bg-amber-50 p-2.5 rounded-lg border border-amber-200 flex items-center">
                            <i className="fa-solid fa-circle-info mr-2"></i> Tentukan status BENAR atau SALAH pada setiap pernyataan berikut:
                        </p>
                        <div className="border border-slate-200 rounded-xl overflow-hidden">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-100 text-xs font-bold text-slate-700 border-b">
                                        <th className="p-3">Pernyataan</th>
                                        <th className="p-3 w-24 text-center">BENAR</th>
                                        <th className="p-3 w-24 text-center">SALAH</th>
                                    </tr>
                                </thead>

                                            onChange={(e) => setNewUser({ ...newUser, username: e.target.value })}
                                            className="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-brand-500"
                                            placeholder="Contoh: siswa04"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Kelas</label>
                                        <select
                                            value={newUser.class}
                                            onChange={(e) => setNewUser({ ...newUser, class: e.target.value })}
                                            className="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-brand-500"
                                        >
                                            <option value="6A">Kelas 6A</option>
                                            <option value="6B">Kelas 6B</option>
                                            <option value="6C">Kelas 6C</option>
                                        </select>
                                    </div>

                                    <div className="flex space-x-2 pt-3">
                                        <button
                                            type="button"
                                            onClick={() => setShowAddUserModal(false)}
                                            className="flex-1 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg"
                                        >
                                            Batal
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 py-2 bg-accent-600 text-white font-bold rounded-lg shadow"
                                        >
                                            Simpan
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
